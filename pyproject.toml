[project]
name = "gedit-lsp"
version = "0.3.0"
description = "Language Server Protocol client plugin for gedit"
authors = [{ name = "Alfred Mickautsch", email = "alfred@mickautsch.de" }]
license = { text = "MIT" }
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "pyfakefs>=5.3",
    "ruff>=0.1.6",
    "mypy>=1.7",
    "PyGObject-stubs<2.10",  # 2.10+ requires PyGObject>=3.55 (GLib 2.80 / girepository-2.0)
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # gi.require_version() must run between `import gi` and `from gi.repository import …`
]

[tool.ruff.lint.per-file-ignores]
# Same gi pattern interleaves test imports, breaking isort grouping.
"tests/**" = ["I001"]
# Fixture for codeAction integration test deliberately contains an
# unused import (`import os`) — that's the whole point of the file:
# pylsp-ruff flags it (F401) and the test exercises the quickfix.
"tests/fixtures/projects/python_code_action/example.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true  # PyGObject stubs are best-effort

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
